<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Produk Baru</title>
    <!-- Memuat Bootstrap dari CDN -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Tambah Produk Baru</h1>
        
        <!-- Aksi POST akan ditangani oleh route app.post('/products') di Express -->
        <form id="productForm" action="/products" method="POST" class="mt-4" style="max-width: 600px; margin: auto;">

            <!-- Input untuk Gambar (File Selector) -->
            <div class="form-group">
                <label for="fileImage">Pilih Gambar Produk</label>
                <!-- Input type file untuk memilih gambar -->
                <input type="file" id="fileImage" class="form-control-file" accept="image/*">
                
                <!-- Pratinjau Gambar -->
                <img id="imagePreview" src="" alt="Pratinjau Gambar" style="max-width: 100px; max-height: 100px; margin-top: 10px; display: none;">
                
                <!-- Hidden input untuk menyimpan data Base64 yang akan dikirim ke server -->
                <!-- Nama 'image' ini yang akan diterima di req.body.image di app.js -->
                <input type="hidden" id="image" name="image">
            </div>

            <!-- Nama Produk -->
            <div class="form-group">
                <label for="title">Nama Produk</label>
                <input type="text" id="title" name="title" class="form-control" required>
            </div>

            <!-- Harga -->
            <div class="form-group">
                <label for="price">Harga</label>
                <input type="number" id="price" name="price" class="form-control" required min="0">
            </div>

            <!-- Stok -->
            <div class="form-group">
                <label for="stock">Stok</label>
                <input type="number" id="stock" name="stock" class="form-control" required min="0">
            </div>

            <!-- Kategori ID -->
            <div class="form-group">
                <label for="product_category_id">Kategori ID</label>
                <input type="number" id="product_category_id" name="product_category_id" class="form-control" required min="1">
            </div>

            <!-- Supplier ID -->
            <div class="form-group">
                <label for="supplier_id">Supplier ID</label>
                <input type="number" id="supplier_id" name="supplier_id" class="form-control" required min="1">
            </div>
            
            <!-- Deskripsi -->
            <div class="form-group">
                <label for="description">Deskripsi</label>
                <textarea id="description" name="description" class="form-control" rows="3" required></textarea>
            </div>

            <button type="submit" class="btn btn-success">Tambah Produk</button>
            <a href="/products" class="btn btn-secondary">Batal</a>
        </form>
    </div>

    <script>
        document.getElementById('fileImage').addEventListener('change', function() {
            const file = this.files[0];
            const reader = new FileReader();
            const imagePreview = document.getElementById('imagePreview');
            const imageHiddenInput = document.getElementById('image');

            if (file) {
                reader.onload = function(e) {
                    // Set preview gambar
                    imagePreview.src = e.target.result;
                    imagePreview.style.display = 'block';

                    // Simpan data Base64 ke hidden input untuk dikirim ke server
                    imageHiddenInput.value = e.target.result;
                };
                // Penting: Membaca file sebagai URL data (Base64)
                reader.readAsDataURL(file); 
            } else {
                imagePreview.style.display = 'none';
                imageHiddenInput.value = '';
            }
        });
    </script>
</body>
</html>
